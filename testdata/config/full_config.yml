version: "0.1"

runtime:
  provider: claude-code
  permission_mode: acceptEdits
  env:
    CLAUDE_AUTOCOMPACT_PCT_OVERRIDE: "80"
    CLAUDE_CODE_EFFORT_LEVEL: "high"

git:
  branch_prefix: task
  default_base: main
  pr:
    auto_pr: true

memory:
  proactive_injection: true
  proactive_max_tokens: 2000
  retention_days:
    learning: 30
