name: CI

on:
  push:
    branches:
      - main
  pull_request:

# 기본은 읽기 전용. 쓰기가 필요한 release 잡에서만 잡 단위로 올린다.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # PR은 새 커밋이 오면 이전 실행을 취소한다. main은 커밋마다 release가 걸려 있어
  # 취소하면 그 커밋이 릴리스되지 않으므로 취소하지 않는다.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # 배포 바이너리 대신 소스에서 빌드한다. golangci-lint-action이 설치하는
      # 바이너리는 go.mod의 toolchain(go1.26)보다 낮은 Go로 빌드돼 있어
      # "the Go language version used to build golangci-lint is lower than the
      # targeted Go version" 으로 린트가 아예 실행되지 않았다.
      #
      # 단 go install만으로는 부족하다 — 이 스텝이 쓰는 Go 자체가 충분히 높아야 한다.
      # setup-go는 v6.0.0부터 go.mod의 toolchain 지시자를 읽는다. v5는 go 지시자(1.24.0)만
      # 보고 Go 1.24를 깔았고, 그 상태의 go install은 golangci-lint를 그 모듈 기준
      # 툴체인(go1.25)으로 빌드해 위 에러가 그대로 재발했다. 그래서 v7로 고정한다.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: golangci-lint
        run: make lint

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: make test

  # 릴리스는 CI를 통과한 커밋에서만 나간다. needs가 하나라도 실패/스킵되면 이 잡은 돌지
  # 않는다. 별도 워크플로 + workflow_run으로 묶지 않은 이유: workflow_run은 기본적으로
  # 트리거한 커밋이 아니라 기본 브랜치 HEAD를 체크아웃하므로, 검증한 커밋과 다른 커밋에
  # 태그를 찍을 수 있다. 같은 워크플로의 needs는 그 커밋임이 보장된다.
  release:
    needs: [lint, build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate CalVer tag
        id: tag
        run: |
          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%-m)
          PREFIX="${YEAR}.${MONTH}"

          LAST_SEQ=$(git tag -l "${PREFIX}.*" | sed "s/${PREFIX}\.//" | sort -n | tail -1)
          if [ -z "$LAST_SEQ" ]; then
            SEQ=1
          else
            SEQ=$((LAST_SEQ + 1))
          fi

          TAG="${PREFIX}.${SEQ}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Generated tag: ${TAG}"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.tag.outputs.tag }}" -m "Release ${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.tag }}
