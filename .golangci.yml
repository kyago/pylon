version: "2"

# 기본 린터(errcheck, govet, ineffassign, staticcheck, unused)를 그대로 쓴다.
linters:
  exclusions:
    # golangci-lint v1이 기본 제공하던 표준 예외를 명시적으로 복원한다. v2는 이를
    # 기본에서 뺐기 때문에, 설정이 없으면 `defer f.Close()` 같은 관용구까지 실패로 잡힌다.
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      # 테스트의 셋업 호출(os.WriteFile/MkdirAll 등)까지 errcheck를 강제하면
      # 신호 대비 잡음이 크다 — 셋업이 실패하면 어차피 그 테스트가 깨진다.
      # 프로덕션 코드에는 그대로 적용된다.
      - path: _test\.go
        linters:
          - errcheck
  settings:
    staticcheck:
      checks:
        - all
        # QF1012(WriteString(fmt.Sprintf(...)) → Fprintf): 이 저장소의 마크다운
        # 생성기들은 WriteString 호출을 줄 단위로 나열하는 형태로 통일돼 있어
        # (buildRootCLAUDEMD, generateContextMD 등) 일괄 전환은 가독성 이득 없이
        # 생성기 전체를 흔든다. 스타일 선택으로 두고 끈다.
        - -QF1012

# gofmt 드리프트를 CI가 잡도록 한다 (`golangci-lint fmt`로 일괄 정리 가능).
formatters:
  enable:
    - gofmt

issues:
  # 같은 유형의 이슈를 3건에서 잘라 보여주는 기본값은 "고쳤더니 새 이슈가 나오는"
  # 착시를 만든다. CI가 전수를 보고하도록 한다.
  max-same-issues: 0
  max-issues-per-linter: 0
